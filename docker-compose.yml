services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./runs:/app/runs
      - ./backend/src:/app/src
      - ./backend/experiments:/app/experiments
      - ./backend/tests:/app/tests
    # Bind to localhost only; the host's system nginx handles routing
    # studio.sshub.dev / api/* to this port on the production host.
    # On a dev machine, http://localhost:8000 still works for direct API hits.
    ports: ["127.0.0.1:8000:8000"]
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Empty NEXT_PUBLIC_API_URL means lib/api.ts uses relative URLs
        # (/api/...). Browser resolves to current origin, host nginx routes
        # /api/* to the backend container. Works in both prod (studio.sshub.dev)
        # and local dev (where curl-to-localhost:3000 is for serving the UI;
        # API calls go through Next.js relative URLs proxied by next.config.js
        # rewrites if configured, or through nginx in prod).
        NEXT_PUBLIC_API_URL: ""
    environment:
      NEXT_PUBLIC_API_URL: ""
      NODE_ENV: production
      # Next.js standalone defaults to binding the container hostname; the
      # in-container HEALTHCHECK hits localhost:3000 and gets connection-refused.
      # Force bind to 0.0.0.0 so the healthcheck reaches the server.
      HOSTNAME: "0.0.0.0"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
